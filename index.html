<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Resume Screening & Job Matching</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--ac:#2f6fed;--ok:#1f9d55;--bad:#d64545;--bd:#e2e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--tx:#e8ebee;--mu:#9aa5b1;--bd:#2d333a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1000px;margin:0 auto;padding:24px}h1{font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
input,textarea{width:100%;padding:8px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button.g{background:transparent;color:var(--bad);padding:2px 6px}
.chip{display:inline-block;padding:2px 8px;margin:2px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.ok{color:var(--ok);border-color:var(--ok)}.no{color:var(--bad);border-color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
function App(){
  const [jobs,setJobs]=useState([]),[file,setFile]=useState(null),[res,setRes]=useState(null);
  const [busy,setBusy]=useState(false),[err,setErr]=useState(""),[explain,setExplain]=useState(false);
  const [f,setF]=useState({title:"",company:"",description:""});
  const load=()=>fetch("/api/jobs").then(r=>r.json()).then(setJobs);
  useEffect(()=>{load()},[]);
  const addJob=async()=>{
    if(!f.title||!f.description)return;
    await fetch("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(f)});
    setF({title:"",company:"",description:""});load();
  };
  const del=async id=>{await fetch("/api/jobs/"+id,{method:"DELETE"});load();};
  const screen=async()=>{
    if(!file)return;setBusy(true);setErr("");
    const fd=new FormData();fd.append("resume",file);fd.append("explain",explain);
    try{const r=await fetch("/api/screen",{method:"POST",body:fd});const d=await r.json();
      if(!r.ok)throw new Error(d.detail||"Failed");setRes(d);}catch(e){setErr(e.message)}
    setBusy(false);
  };
  return <div className="wrap">
    <h1>AI Resume Screening & Job Matching</h1>
    <div className="grid">
      <div>
        <div className="card"><b>1. Upload resume</b>
          <input type="file" accept=".pdf,.docx,.txt" onChange={e=>setFile(e.target.files[0])}/>
          <label className="mu"><input type="checkbox" style={{width:"auto"}} checked={explain} onChange={e=>setExplain(e.target.checked)}/> Add Claude summary (needs ANTHROPIC_API_KEY)</label><br/>
          <button onClick={screen} disabled={busy||!file}>{busy?"Analyzing...":"Screen & match"}</button>
          {err&&<p style={{color:"var(--bad)"}}>{err}</p>}
        </div>
        <div className="card"><b>2. Add a job</b>
          <input placeholder="Title" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/>
          <input placeholder="Company" value={f.company} onChange={e=>setF({...f,company:e.target.value})}/>
          <textarea rows="4" placeholder="Job description" value={f.description} onChange={e=>setF({...f,description:e.target.value})}/>
          <button onClick={addJob}>Add job</button>
        </div>
        <div className="card"><b>Jobs ({jobs.length})</b>
          {jobs.map(j=><div key={j.id} className="row" style={{marginTop:8}}>
            <span>{j.title} <span className="mu">· {j.company}</span></span>
            <button className="g" onClick={()=>del(j.id)}>delete</button></div>)}
        </div>
      </div>
      <div>
        {!res&&<div className="card mu">Results appear here.</div>}
        {res&&<>
          <div className="card"><b>Detected skills</b><div>{res.skills.map(s=><span key={s} className="chip">{s}</span>)}</div>
            <p className="mu">{res.analysis.words} words · {res.analysis.email||"no email found"}</p>
            {res.analysis.tips.map(t=><div key={t} className="mu">• {t}</div>)}
          </div>
          {res.summary&&<div className="card"><b>Claude's take</b><p>{res.summary}</p></div>}
          {res.matches.map(m=><div className="card" key={m.id}>
            <div className="row"><b>{m.title} <span className="mu">· {m.company}</span></b><b>{m.score}%</b></div>
            <div className="bar"><i style={{width:m.score+"%"}}/></div>
            <div>{m.matched.map(s=><span key={s} className="chip ok">{s}</span>)}{m.missing.map(s=><span key={s} className="chip no">{s}</span>)}</div>
          </div>)}
        </>}
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
